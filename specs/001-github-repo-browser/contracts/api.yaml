openapi: 3.0.3
info:
  title: GitHub Repo Browser API
  version: 1.0.0
  description: >
    Backend contract consumed by the React SPA. Proxies GitHub REST (API version
    2026-03-10) with a 10-minute snapshot cache and a recent-searches history.
servers:
  - url: /api
paths:
  /users/{username}:
    get:
      summary: Fetch a user's profile and public repositories (cached)
      operationId: getUserSnapshot
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
            pattern: '^[a-zA-Z0-9](?:[a-zA-Z0-9]|-(?=[a-zA-Z0-9])){0,38}$'
        - name: refresh
          in: query
          required: false
          description: When true, bypass the cache window and fetch live (FR-015).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Snapshot (from cache or live).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '400':
          description: Username fails GitHub username rules (FR-001).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: GitHub user does not exist (FR-010).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: GitHub quota exhausted (FR-011). `retryAfterSeconds` present when known.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/RateLimitProblem' }
        '502':
          description: GitHub unreachable or returned an unexpected error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /searches/recent:
    get:
      summary: Most recent successful searches (FR-016)
      operationId: getRecentSearches
      responses:
        '200':
          description: Up to 10 usernames, most recent first, deduplicated.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/RecentSearch'
components:
  schemas:
    SnapshotResponse:
      type: object
      required: [profile, repos, fetchedAt, fromCache, truncated]
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
        repos:
          type: array
          maxItems: 300
          items: { $ref: '#/components/schemas/Repo' }
        fetchedAt:
          type: string
          format: date-time
          description: When the data was fetched from GitHub (shown in UI, FR-015).
        fromCache:
          type: boolean
        truncated:
          type: boolean
          description: True when the user has more than 300 repositories (FR-014).
    Profile:
      type: object
      required: [login, avatarUrl, followers, publicRepos, htmlUrl]
      properties:
        login: { type: string }
        name: { type: string, nullable: true }
        avatarUrl: { type: string, format: uri }
        bio: { type: string, nullable: true }
        followers: { type: integer }
        publicRepos: { type: integer }
        htmlUrl: { type: string, format: uri }
    Repo:
      type: object
      required: [name, stars, forks, updatedAt, fork, archived, htmlUrl, cloneUrl]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        language: { type: string, nullable: true }
        stars: { type: integer }
        forks: { type: integer }
        updatedAt: { type: string, format: date-time }
        fork: { type: boolean }
        archived: { type: boolean }
        htmlUrl: { type: string, format: uri }
        homepage: { type: string, nullable: true }
        cloneUrl: { type: string }
    RecentSearch:
      type: object
      required: [username, searchedAt]
      properties:
        username: { type: string }
        searchedAt: { type: string, format: date-time }
    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [title, status, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: Human-readable, user-safe message (never a stack trace).
    RateLimitProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            retryAfterSeconds:
              type: integer
              nullable: true
              description: Seconds until the GitHub quota resets, when known.
